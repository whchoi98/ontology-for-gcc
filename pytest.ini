[pytest]
# Sibling 프로젝트 (ontology-for-mfg / ontology-for-retail) 의 tests 가
# 같은 `tests` namespace package 로 인식되며 동일 이름 모듈끼리 충돌하던
# 이슈를 tests/__init__.py 제거로 해결 (namespace package 자체 비활성).
testpaths = tests
pythonpath = .
norecursedirs = .git node_modules .next __pycache__ cdk.out .venv build dist .pytest_cache .ruff_cache .harness-eval graphify-out raw_data
